<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Not found — Tapedeck</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="preload" as="font" type="font/woff2" href="/fonts/caprasimo-400-latin.woff2" crossorigin />
		<!--
			Deliberately standalone: this is served for paths SvelteKit never built,
			so it can't reference the fingerprinted app CSS. That means the few
			values below are the one place in the site that repeats the design
			tokens instead of reading them — keep them in step with src/app.css and
			src/site.css if the palette moves.

			The payoff is that it works with no JavaScript at all, which the
			SvelteKit fallback shell did not.
		-->
		<style>
			@font-face {
				font-family: 'Caprasimo';
				font-style: normal;
				font-weight: 400;
				font-display: swap;
				src: url('/fonts/caprasimo-400-latin.woff2') format('woff2');
			}
			@font-face {
				font-family: 'Figtree';
				font-style: normal;
				font-weight: 400 700;
				font-display: swap;
				src: url('/fonts/figtree-var-latin.woff2') format('woff2');
			}
			:root {
				--bg: #f5ead8;
				--text: #201e1d;
				--muted: #6b6255;
				--accent: #c67139;
				--accent-deep: #93501f;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #1a1815;
					--text: #f5ead8;
					--muted: #a89d8a;
					--accent: #c67139;
					--accent-deep: #f6a06b;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 40px 24px;
				background: var(--bg);
				color: var(--text);
				font-family: Figtree, system-ui, sans-serif;
				font-size: 16px;
				line-height: 1.6;
			}
			main {
				max-width: 46ch;
				text-align: center;
			}
			.mark {
				display: inline-grid;
				place-items: center;
				width: 44px;
				height: 44px;
				border-radius: 13px;
				background: var(--accent);
				color: var(--bg);
				margin-bottom: 26px;
			}
			h1 {
				font-family: Caprasimo, Georgia, serif;
				font-weight: 400;
				font-size: clamp(34px, 6vw, 52px);
				letter-spacing: -0.025em;
				line-height: 1.06;
				margin: 0;
			}
			p {
				color: var(--muted);
				text-wrap: pretty;
				margin: 16px 0 0;
			}
			nav {
				display: flex;
				flex-wrap: wrap;
				gap: 10px;
				justify-content: center;
				margin-top: 30px;
			}
			a {
				color: var(--accent-deep);
				text-decoration: none;
				border: 1px solid color-mix(in srgb, var(--text) 18%, transparent);
				border-radius: 999px;
				padding: 9px 18px;
				font-size: 14px;
			}
			a:hover {
				background: color-mix(in srgb, var(--accent) 14%, transparent);
			}
			a.primary {
				background: var(--accent);
				border-color: var(--accent);
				color: var(--bg);
			}
			a:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
			}
		</style>
	</head>
	<body>
		<main>
			<span class="mark">
				<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<rect x="2" y="5" width="20" height="14" rx="3" />
					<circle cx="8" cy="12" r="2" />
					<circle cx="16" cy="12" r="2" />
				</svg>
			</span>
			<h1>Nothing on this side.</h1>
			<p>That page isn't here — the tape ran out, or the link was wrong.</p>
			<nav>
				<a class="primary" href="/">Home</a>
				<a href="/features/">Features</a>
				<a href="/plugins/">Plugins</a>
				<a href="/docs/">Docs</a>
			</nav>
		</main>
	</body>
</html>
