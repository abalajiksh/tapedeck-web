<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<!-- The two latin faces every page paints with, fetched in parallel with
		     the CSS rather than after it. The latin-ext files stay on demand. -->
		<link rel="preload" as="font" type="font/woff2" href="%sveltekit.assets%/fonts/caprasimo-400-latin.woff2" crossorigin />
		<link rel="preload" as="font" type="font/woff2" href="%sveltekit.assets%/fonts/figtree-var-latin.woff2" crossorigin />
		<!-- Resolve the theme before first paint, or the page flashes light then
		     swaps. Mirrors the toggle in src/lib/theme.js — keep the key in step. -->
		<script>
			(function () {
				try {
					var p = localStorage.getItem('tapedeck-site-theme') || 'system';
					var dark = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
					document.documentElement.setAttribute('data-theme-pref', p);
				} catch (e) {
					document.documentElement.setAttribute('data-theme', 'light');
					document.documentElement.setAttribute('data-theme-pref', 'system');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
